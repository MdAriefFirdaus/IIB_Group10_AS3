  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback - Darwin Wonderland Canteen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Darwin Wonderland Canteen</h1>
    <p>We value your thoughts and suggestions.</p>
  </header>

  <main>
    <section class="card">
      <h2>Student Feedback & Suggestions</h2>
      <p>Let us know what you think of the canteen food or service!</p>
      <form>
        <div style="margin-bottom: 1rem;">
          <label for="name" style="display: block; margin-bottom: 0.3rem; font-weight: 600;">Your Name:</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label for="feedback" style="display: block; margin-bottom: 0.3rem; font-weight: 600;">Your Comments:</label>
          <textarea id="feedback" name="feedback" rows="4" placeholder="Tell us about today's meal..." required style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box;"></textarea>
        </div>
        <button type="submit" style="background-color: var(--primary-blue); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; font-weight: 600; cursor: pointer;">Submit Feedback</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Darwin Wonderland Canteen | iibgroup10as3</p>
  </footer>
</body>
